# One Post A Day —— 后端 nginx 配置（阿里云香港 ECS）
#
# 只做 API 反向代理。前端是 Expo static export，部署在 Vercel（onedayapost.fun），
# 不由这台服务器 serve —— 这跟旧版配置不同，旧版是 nginx 同时 serve dist/。
#
# 安装：
#   sudo cp api.nginx.conf /etc/nginx/sites-available/onedayapost-api
#   sudo ln -sf /etc/nginx/sites-available/onedayapost-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（先确保 DNS 已解析到本机，否则签发会失败）：
#   sudo certbot --nginx -d api.onedayapost.fun

# HTTP：只保留 certbot 校验，其余跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.onedayapost.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25+ 才支持独立的 `http2 on;`；Ubuntu 22.04 自带 1.18，
    # 只能写在 listen 后面。写成 `http2 on;` 会报 unknown directive 并导致 nginx 起不来。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.onedayapost.fun;

    # certbot --nginx 会自动填这几行；手动配时替换成实际路径
    ssl_certificate     /etc/letsencrypt/live/api.onedayapost.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.onedayapost.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/onedayapost-api-access.log;
    error_log  /var/log/nginx/onedayapost-api-error.log;

    # 发帖带多图，但图片是前端直传 OSS 的，请求体只有 JSON + 图片 URL。
    # 2m 足够，同时挡住异常大的请求体。
    client_max_body_size 2m;

    # CORS 由 FastAPI 的 CORSMiddleware 统一处理（见 server/main.py 的 CORS_ORIGINS）。
    # nginx 这里【不要】再加 add_header Access-Control-*，否则会出现重复头，
    # 浏览器会因为 "multiple values" 直接拒绝跨域请求。

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 生产环境关掉自动生成的 API 文档，避免暴露全部接口结构
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15768000" always;
}
