# One Post A Day —— 前端静态站 + 后端 API 反代
#
# 前端从 Vercel 迁到本机（Vercel 后台登不上了，且它早就停止部署）。
# 一台服务器同时承载：
#   onedayapost.fun      → 静态文件 /var/www/onedayapost
#   api.onedayapost.fun  → 反代 127.0.0.1:4000（见 api.nginx.conf）
#
# 安装：
#   sudo cp web.nginx.conf /etc/nginx/sites-available/onedayapost-web
#   sudo ln -sf /etc/nginx/sites-available/onedayapost-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（DNS 先指过来，否则签发失败）：
#   sudo certbot --nginx -d onedayapost.fun

server {
    listen 80;
    listen [::]:80;
    server_name onedayapost.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://onedayapost.fun$request_uri;
    }
}

# www 子域：目前 DNS 仍指向 Vercel，证书里也不含 www，故先不启用。
# 等 www 的 A 记录也切到本机后：
#   sudo certbot --nginx -d onedayapost.fun -d www.onedayapost.fun
# 再取消下面这段的注释。
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name www.onedayapost.fun;
#     ssl_certificate     /etc/letsencrypt/live/onedayapost.fun/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/onedayapost.fun/privkey.pem;
#     return 301 https://onedayapost.fun$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onedayapost.fun;

    ssl_certificate     /etc/letsencrypt/live/onedayapost.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onedayapost.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/onedayapost;
    index index.html;

    access_log /var/log/nginx/onedayapost-web-access.log;
    error_log  /var/log/nginx/onedayapost-web-error.log;

    # 压缩。JS bundle 未压缩约 1.9MB，br/gzip 后约 480KB——
    # 这是首屏速度的关键，务必开启。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml;

    # ── 带内容 hash 的构建产物：可以永久强缓存 ──
    # 文件名变了 URL 就变了，所以 immutable 是安全的。
    # Vercel 上这条配置一直没生效（实测返回 max-age=0），迁过来正好修掉。
    location /_expo/static/ {
        # 只用 add_header，不要再写 expires——两者会各生成一条 Cache-Control，
        # 响应里出现重复头
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # manifest 会变（改名字/图标时），给短缓存
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # HTML 不缓存：否则改版后用户拿到旧壳、引用已删除的 bundle 会白屏
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /favicon.ico { access_log off; try_files $uri =404; }

    # iOS 加主屏幕时会先请求这两个根路径文件（不看 head 里的 link 标签）。
    # 必须存在真文件，否则下面的 SPA 兜底会返回 index.html，
    # iOS 拿 HTML 当 PNG 解析失败 → 主屏幕显示灰色占位图标。
    location ~ ^/apple-touch-icon(-precomposed)?\.png$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # 静态资源类扩展名一律不走 SPA 兜底：找不到就 404。
    # 否则任何拼错的图片/字体路径都会拿到一份 HTML，
    # 表现成各种诡异的「资源损坏」而不是干净的 404。
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|map|txt|xml)$ {
        try_files $uri =404;
    }

    # ── 路由：对应 vercel.json 里的 routes ──
    # expo-router 的 static export 为每个路由生成了独立 HTML，
    # 所以不能一律回退到 index.html——那样 /profile 会拿到首页的壳，
    # hydration 后 Tab 高亮会错位（这也是 inject-fonts.js 关掉 hydration 的原因）。
    location = /explore { try_files /explore.html =404; }
    location = /profile { try_files /profile.html =404; }
    location = /modal   { try_files /modal.html =404; }
    location = /image   { try_files /image.html =404; }

    # 其余路径：先找同名文件，再找 .html，最后回退首页（SPA 兜底）
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=15768000" always;
}
