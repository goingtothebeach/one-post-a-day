name: Daily Lottery

# 只保留手动触发。**没有 schedule，这不是定时任务。**
#
# 抽签的唯一定时触发源是服务器上的 onedayapost-lottery.timer
# （18:00:00 Asia/Shanghai，实测 18:00:00 整点火、12ms 完成）。
#
# 为什么删掉原来的 cron：
# 1. GitHub 的 scheduled workflow 是 best-effort，实测三晚里迟到 6 小时一次、
#    整晚没触发一次 —— 而「每晚 18:00 准时开奖」就是这个产品本身。
# 2. 它曾被当作「服务器宕机时的兜底」，但这个理由是错的：它打
#    api.onedayapost.fun，DNS 解析到 47.243.211.168，就是跑 timer 的那台机器。
#    机器宕了它一样失败，防不住单点。
# 3. 双触发源违反项目的硬约束（抽签只能有一个触发源），也让每次排查开奖问题
#    都要先分辨「哪个源触发的」——这个成本真实发生过。
#
# 保留 workflow_dispatch 是为了留一个不用 SSH 的手动补开入口：
# timer 万一被误 disable、或哪次开奖需要人工补，点一下就行。
# /lottery/run 幂等（已有赢家直接早退），所以手动重试永远安全。
on:
  workflow_dispatch:

jobs:
  run-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lottery
        env:
          # 只认 API_BASE_URL。原来这里是
          #   ${{ secrets.API_BASE_URL || secrets.RAILWAY_API_URL }}
          # 那个回退是个陷阱：Railway 早已弃用，一旦 API_BASE_URL 没配好，
          # 请求会静默打到已死的 Railway 域名，而下面的「未配置」检查
          # 只在两个都为空时才触发 —— 等于报错报不出来。
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::未配置 API_BASE_URL Secret"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::未配置 CRON_SECRET Secret；后端 fail-closed 会返回 503"
            exit 1
          fi
          # /lottery/run 是幂等的：该轮已开奖会直接返回既有赢家，重试不会重抽。
          # 无人报名时返回 200 + winner=null，不会误报警。
          # 不用 -f：它会把响应体丢掉，失败时看不到后端给的原因。
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$API_BASE_URL/lottery/run" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --max-time 30)
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::抽签调用失败，HTTP $code"
            exit 1
          fi
